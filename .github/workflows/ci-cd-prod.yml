name: PROD CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  NODE_VERSION: "24"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Synthesize CDK
        env:
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.PROD_CDK_BOOTSTRAP_QUALIFIER }}
        run: |
          set -euo pipefail
          cdk_args=(--strict)
          if [[ -n "${CDK_BOOTSTRAP_QUALIFIER:-}" ]]; then
            cdk_args+=(--context "@aws-cdk/core:bootstrapQualifier=${CDK_BOOTSTRAP_QUALIFIER}")
          fi
          npm run synth -- "${cdk_args[@]}"

  deploy-prod:
    name: Deploy PROD
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check PROD deployment configuration
        id: prod-config
        env:
          PROD_AWS_ROLE_ARN: ${{ vars.PROD_AWS_ROLE_ARN }}
          PROD_ASANA_BUSH_PROJECT_GID: ${{ vars.PROD_ASANA_BUSH_PROJECT_GID }}
        run: |
          if [[ -n "${PROD_AWS_ROLE_ARN}" && -n "${PROD_ASANA_BUSH_PROJECT_GID}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PROD deploy because PROD_AWS_ROLE_ARN or PROD_ASANA_BUSH_PROJECT_GID is not configured."
          fi

      - name: Configure AWS credentials
        if: steps.prod-config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}

      - name: Deploy CDK stack to PROD
        if: steps.prod-config.outputs.configured == 'true'
        env:
          ASANA_BUSH_PROJECT_GID: ${{ vars.PROD_ASANA_BUSH_PROJECT_GID }}
          ASANA_WORKSPACE_GID: ${{ vars.PROD_ASANA_WORKSPACE_GID }}
          ASANA_PAT_SECRET_NAME: ${{ vars.PROD_ASANA_PAT_SECRET_NAME }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.PROD_CDK_BOOTSTRAP_QUALIFIER }}
        run: |
          set -euo pipefail
          : "${ASANA_BUSH_PROJECT_GID:?PROD_ASANA_BUSH_PROJECT_GID repository variable is required}"
          cdk_args=(
            --require-approval never
            --parameters "AsanaBushProjectGid=${ASANA_BUSH_PROJECT_GID}"
            --parameters "AsanaWorkspaceGid=${ASANA_WORKSPACE_GID:-}"
            --parameters "AsanaPatSecretName=${ASANA_PAT_SECRET_NAME:-dispute-email-runtime/asana-pat}"
          )
          if [[ -n "${CDK_BOOTSTRAP_QUALIFIER:-}" ]]; then
            cdk_args+=(--context "@aws-cdk/core:bootstrapQualifier=${CDK_BOOTSTRAP_QUALIFIER}")
          fi
          npm run cdk deploy -- "${cdk_args[@]}"
